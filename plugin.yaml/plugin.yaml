name: ctrlall
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Drive ctrl+all on your Mac from Hermes: launch and steer multiplayer coding-agent
  chats (Claude Code, Gemini, opencode and more), read transcripts and the team inbox,
  review git status and diffs, through the ctrl+all daemon's authenticated loopback RPC.
author: Naman Goyal
license: MIT
homepage: https://github.com/namangoyal3/hermes-ctrlall
tags: [multiplayer, coding-agents, ctrlall, mac, claude-code, codex]
requires_hermes: ">=0.21.5"
provides_tools:
  - ctrlall_ping
  - ctrlall_capabilities
  - ctrlall_providers
  - ctrlall_chats
  - ctrlall_chat_create
  - ctrlall_chat_send
  - ctrlall_chat_wait
  - ctrlall_chat_tail
  - ctrlall_chat_search
  - ctrlall_chat_cancel
  - ctrlall_chat_mode
  - ctrlall_inbox
  - ctrlall_git_status
  - ctrlall_git_diff
config_schema:
  daemon_url:
    type: str
    default: "http://127.0.0.1:9931"
    label: "ctrl+all daemon URL"
    description: "Loopback URL of the running ctrl+all daemon (see ~/.ctrlall/control.json)."
  daemon_token:
    type: secret
    env: CTRLALL_DAEMON_TOKEN
    description: "Bearer token of the running ctrl+all daemon (the newest kind=daemon entry in ~/.ctrlall/control.json). Stored by Hermes, never written to config.yaml."
  request_timeout:
    type: int
    default: 130
    description: "HTTP timeout in seconds. Keep it above your longest ctrlall_chat_wait timeout."
